#
# Applies the kind/* label to a pull request after the "Label PR" workflow has
# run for it. See label-pr.yaml for why labeling is split in two.
#
# workflow_run always runs the version of this file on the default branch, with
# a token that can write to pull requests, including pull requests from forks.
# That is safe here because this workflow checks out no code and treats
# everything it receives as untrusted:
#   - The artifact is produced by a run of the pull request's own code, so only
#     a plain number is accepted from it, and the pull request it names must
#     have the same head commit as the run that produced it.
#   - The label is chosen from a fixed list, using the pull request description
#     read as plain text.
name: Label PR (apply)
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["Label PR"]
    types: [completed]
permissions: {}
jobs:
  label:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read  # download the artifact from the triggering run
      pull-requests: write  # add the label
    steps:
      - name: Download PR number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number
          path: ${{ runner.temp }}/pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Label PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            const fs = require('fs');
            const path = require('path');

            const keywords = {
              "breaking": "kind/breaking",
              "bug": "kind/bug",
              "enhancement": "kind/enhancement",
              "cleanup": "kind/cleanup",
              "documentation": "kind/documentation"
            };

            const file = path.join(process.env.RUNNER_TEMP, 'pr-number', 'pr-number.txt');
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.size > 32) {
              core.setFailed('The pr-number artifact is not a small regular file.');
              return;
            }
            const raw = fs.readFileSync(file, 'utf8').trim();
            if (!/^[1-9][0-9]{0,8}$/.test(raw)) {
              core.setFailed('The pr-number artifact does not contain a valid PR number.');
              return;
            }
            const prNumber = Number(raw);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.warning(`PR #${prNumber} does not match the commit of the run that produced the artifact, skipping.`);
              return;
            }

            const match = (pr.body ?? '').match(/^\s*\/kind\s+(.+)$/m);
            const label = match && Object.hasOwn(keywords, match[1])
              ? keywords[match[1]]
              : 'kind/other';

            core.info(`Adding label '${label}' to PR #${prNumber}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [label]
            });
