#
# Labels pull requests with a kind/* label taken from the "/kind <type>" line in
# the pull request description.
#
# Labeling is split across two workflows so that neither needs the
# pull_request_target trigger:
#   1. This workflow runs on pull_request. It has no permissions and only
#      records the pull request number.
#   2. label-pr-apply.yaml runs on workflow_run from the default branch, with
#      permission to write to pull requests, and applies the label.
name: Label PR
on:
  pull_request:
permissions: {}
jobs:
  record-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload PR number
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-number
          path: pr-number.txt
          retention-days: 1
          if-no-files-found: error
