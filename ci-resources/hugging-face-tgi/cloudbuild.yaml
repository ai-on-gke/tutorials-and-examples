# This REPLACES hugging-face-tgi/cloudbuild.yaml (still in the example
# directory, untouched by this change) as the pipeline that actually runs:
# that file's `dir:` fields point at `infrastructure/` and
# `tutorials-and-examples/hf-tgi/`, neither of which exist in this repo's
# current layout - it looks orphaned from a prior combined-monorepo structure.
# hugging-face-tgi's own main.tf expects a cluster to already exist (it has no
# module "gke_cluster" of its own, unlike adk/vertex etc.), so this pipeline
# creates one directly with gcloud first.
#
# No Hugging Face token is needed: the module downloads Mistral-7B-Instruct-v0.1
# from a public GCS bucket (gs://vertex-model-garden-public-us/...), not the HF
# Hub.

steps:
- id: "hugging-face-tgi: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/hugging-face-tgi/tests /workspace/hugging-face-tgi/tests

- id: 'hugging-face-tgi: validate platform'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/hugging-face-tgi"
  script: |
    terraform init -no-color
    terraform validate -no-color
  waitFor: ["hugging-face-tgi: prepare tests"]

- id: 'hugging-face-tgi: create gke cluster'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/hf_tgi_gke_cluster_result.txt
    gcloud container clusters create ml-hftgi-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_HF_TGI_REGION \
      --num-nodes=1 \
      --machine-type=n1-standard-8
    gcloud container node-pools create gpu-pool \
      --cluster=ml-hftgi-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_HF_TGI_REGION \
      --machine-type=g2-standard-24 \
      --accelerator=type=nvidia-l4,count=2,gpu-driver-version=DEFAULT \
      --num-nodes=1
    echo "pass" > /workspace/hf_tgi_gke_cluster_result.txt
  allowFailure: true
  waitFor: ['hugging-face-tgi: validate platform']

- id: 'hugging-face-tgi: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-hftgi-${SHORT_SHA}-${_BUILD_ID}'
  - '--region=${_HF_TGI_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['hugging-face-tgi: create gke cluster']

- id: 'hugging-face-tgi: deploy workload'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/hugging-face-tgi"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/hf_tgi_deploy_result.txt
    terraform apply \
    -var-file=workloads.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=cluster_name=ml-hftgi-$SHORT_SHA-$_BUILD_ID \
    -var=location=$_HF_TGI_REGION \
    -var=namespace=ml-hftgi-$SHORT_SHA-$_BUILD_ID \
    -var=autopilot_cluster=false \
    -auto-approve -no-color
    echo "pass" > /workspace/hf_tgi_deploy_result.txt
  allowFailure: true
  waitFor: ['hugging-face-tgi: generate kubeconfig']

- id: 'hugging-face-tgi: test guide'
  name: "gcr.io/cloud-builders/kubectl"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/hf_tgi_test_guide.txt

    NAMESPACE="ml-hftgi-$SHORT_SHA-$_BUILD_ID"
    # The module's own comment notes this can take >10m on a fresh GPU node.
    kubectl wait --all pods -n "$$NAMESPACE" --for=condition=Ready --timeout=1800s
    kubectl port-forward -n "$$NAMESPACE" service/mistral-7b-instruct-service 8080:80 &
    sleep 10s

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/hugging-face-tgi/tests/test.py http://127.0.0.1:8080

    echo "pass" > /workspace/hf_tgi_test_guide.txt
  allowFailure: true
  waitFor: ['hugging-face-tgi: deploy workload']

- id: 'hugging-face-tgi: cleanup workload'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/hugging-face-tgi"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/hf_tgi_cleanup_workload_result.txt
    terraform destroy \
    -var-file=workloads.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=cluster_name=ml-hftgi-$SHORT_SHA-$_BUILD_ID \
    -var=location=$_HF_TGI_REGION \
    -var=namespace=ml-hftgi-$SHORT_SHA-$_BUILD_ID \
    -var=autopilot_cluster=false \
    -auto-approve -no-color
    echo "pass" > /workspace/hf_tgi_cleanup_workload_result.txt
  allowFailure: true
  waitFor: ['hugging-face-tgi: test guide']

- id: 'hugging-face-tgi: cleanup gke cluster'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/hf_tgi_cleanup_cluster_result.txt
    gcloud container clusters delete ml-hftgi-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_HF_TGI_REGION \
      --quiet
    echo "pass" > /workspace/hf_tgi_cleanup_cluster_result.txt
  allowFailure: true
  waitFor: ['hugging-face-tgi: cleanup workload']

- id: 'hugging-face-tgi: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "hugging-face-tgi") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/hf_tgi_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* hugging-face-tgi gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/hf_tgi_deploy_result.txt) != "pass" ]]; then
      failed_steps+="* hugging-face-tgi workload deployment failed\n"
    fi

    if [[ $(cat /workspace/hf_tgi_test_guide.txt) != "pass" ]]; then
      failed_steps+="* hugging-face-tgi test guide failed\n"
    fi

    if [[ $(cat /workspace/hf_tgi_cleanup_workload_result.txt) != "pass" ]]; then
      failed_steps+="* hugging-face-tgi workload cleanup failed\n"
    fi

    if [[ $(cat /workspace/hf_tgi_cleanup_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* hugging-face-tgi gke cluster cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="Hugging Face TGI CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "hugging-face-tgi", "ci/automated-issue"]}' "$issue_title" "$issue_body")


      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['hugging-face-tgi: cleanup gke cluster']

- id: 'hugging-face-tgi: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    for f in hf_tgi_gke_cluster_result hf_tgi_deploy_result hf_tgi_test_guide hf_tgi_cleanup_workload_result hf_tgi_cleanup_cluster_result; do
      if [[ $(cat /workspace/$f.txt) != "pass" ]]; then
        echo "$f failed"
        echo "error" > /workspace/check_result.txt
      fi
    done

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['hugging-face-tgi: create github issue']

substitutions:
  _HF_TGI_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
