#
# No terraform module here (SETUP.md drives the cluster directly with
# gcloud), so this mirrors the autoscale/blue-green-gateway pipeline shape.
#
# Uses nvidia-tesla-a100 (a2-highgpu-1g), matching the example's own
# nodeSelector - not L4 like most other GPU examples in this repo. Real cost/
# quota consideration, flagged here rather than silently building it.
#
# health-policy.yaml's targetRef.name is "ll-service", but the actual Service
# the example deploys is named "llm-service" (see vllm-service.yaml) - looks
# like a typo in the example's own manifest. Fixed in the rendered copy this
# pipeline applies; the example directory itself is left untouched.
#
# The InferencePool's extensionRef expects an Endpoint Picker (EPP)
# deployment that no manifest here creates - this relies on GKE's
# `--enable-inference-gateway` managed feature to auto-provision the EPP
# controller when it sees the InferencePool object, per SETUP.md's documented
# flow (no separate EPP helm install step is shown there either).

steps:
- id: "lora-inference-gateway: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/lora-inference-gateway/tests /workspace/lora-inference-gateway/tests

- id: 'lora-inference-gateway: create gke cluster'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/lora_gw_gke_cluster_result.txt
    gcloud container clusters create ml-lora-gw-$SHORT_SHA-$_BUILD_ID \
      --region=$_LORA_GW_REGION \
      --release-channel=rapid \
      --enable-inference-gateway \
      --num-nodes=1 \
      --machine-type=e2-standard-4 \
      --project=$PROJECT_ID
    gcloud container node-pools create gpu-pool \
      --cluster=ml-lora-gw-$SHORT_SHA-$_BUILD_ID \
      --region=$_LORA_GW_REGION \
      --machine-type=a2-highgpu-1g \
      --accelerator=type=nvidia-tesla-a100,count=1,gpu-driver-version=DEFAULT \
      --num-nodes=1 \
      --project=$PROJECT_ID
    echo "pass" > /workspace/lora_gw_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["lora-inference-gateway: prepare tests"]

- id: 'lora-inference-gateway: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-lora-gw-${SHORT_SHA}-${_BUILD_ID}'
  - '--region=${_LORA_GW_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['lora-inference-gateway: create gke cluster']

- id: 'lora-inference-gateway: deploy'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/lora-inference-gateway"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/lora_gw_deploy_result.txt

    kubectl create secret generic hf-secret \
      --from-literal=token=$$HF_TOKEN \
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl apply -f gateway.yaml
    kubectl apply -f gateway-access.yaml
    kubectl apply -f vllm-deployment.yaml
    kubectl apply -f vllm-service.yaml
    kubectl apply -f inference-pool.yaml
    kubectl apply -f inference-model.yaml

    sed 's/name: ll-service/name: llm-service/' health-policy.yaml > /workspace/health-policy-rendered.yaml
    kubectl apply -f /workspace/health-policy-rendered.yaml

    kubectl wait --for=condition=Available --timeout=900s deployment/vllm-gemma-deployment

    echo "pass" > /workspace/lora_gw_deploy_result.txt
  secretEnv: ["HF_TOKEN"]
  allowFailure: true
  waitFor: ['lora-inference-gateway: generate kubeconfig']

- id: 'lora-inference-gateway: test guide'
  name: "gcr.io/cloud-builders/kubectl"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/lora_gw_test_guide.txt

    GATEWAY_IP=$(kubectl get gateway ai-inf-gateway -o jsonpath='{.status.addresses[0].value}')
    n=0
    while [ -z "$$GATEWAY_IP" ] && [ $n -lt 60 ]; do
      echo "Waiting for Gateway IP..."
      sleep 10
      GATEWAY_IP=$(kubectl get gateway ai-inf-gateway -o jsonpath='{.status.addresses[0].value}')
      n=$((n+1))
    done
    if [ -z "$$GATEWAY_IP" ]; then
      echo "Gateway never got an address."
      exit 1
    fi
    echo "Gateway IP: $$GATEWAY_IP"

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/lora-inference-gateway/tests/test.py "$$GATEWAY_IP"

    echo "pass" > /workspace/lora_gw_test_guide.txt
  allowFailure: true
  waitFor: ['lora-inference-gateway: deploy']

- id: 'lora-inference-gateway: cleanup'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/lora_gw_cleanup_result.txt
    gcloud container clusters delete ml-lora-gw-$SHORT_SHA-$_BUILD_ID \
      --region=$_LORA_GW_REGION \
      --project=$PROJECT_ID \
      --quiet
    echo "pass" > /workspace/lora_gw_cleanup_result.txt
  allowFailure: true
  waitFor: ['lora-inference-gateway: test guide']

- id: 'lora-inference-gateway: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "lora-inference-gateway") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/lora_gw_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* lora-inference-gateway gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/lora_gw_deploy_result.txt) != "pass" ]]; then
      failed_steps+="* lora-inference-gateway deployment failed\n"
    fi

    if [[ $(cat /workspace/lora_gw_test_guide.txt) != "pass" ]]; then
      failed_steps+="* lora-inference-gateway test guide failed\n"
    fi

    if [[ $(cat /workspace/lora_gw_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* lora-inference-gateway cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="LoRA Inference Gateway CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "lora-inference-gateway", "ci/automated-issue"]}' "$issue_title" "$issue_body")


      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['lora-inference-gateway: cleanup']

- id: 'lora-inference-gateway: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    for f in lora_gw_gke_cluster_result lora_gw_deploy_result lora_gw_test_guide lora_gw_cleanup_result; do
      if [[ $(cat /workspace/$f.txt) != "pass" ]]; then
        echo "$f failed"
        echo "error" > /workspace/check_result.txt
      fi
    done

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['lora-inference-gateway: create github issue']

substitutions:
  _LORA_GW_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/cloudbuild-hf-token/versions/latest
    env: "HF_TOKEN"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
