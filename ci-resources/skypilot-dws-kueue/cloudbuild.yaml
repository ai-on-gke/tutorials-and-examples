#
# This example's own README is just a stub pointing at an external doc site,
# so the flow here is reconstructed from main.tf (the same common-infra
# `infrastructure` module ray-serve/adk-vertex already use in this repo) and
# kueue_resources.yaml (identical shape to workflow-orchestration/dws-example's
# queue config) - Kueue itself isn't installed by any file in this directory,
# so this pipeline installs it explicitly, pinned to the same v0.12.0 the
# sibling dws-example README documents.
#
# Runs train_dws.yaml (a short bert-base-cased/IMDB run, max_steps=50) rather
# than finetune.yaml (a full Gemma LoRA finetune) - same real
# SkyPilot-through-Kueue-through-DWS path, far cheaper/faster for CI, and
# doesn't need an HF token.
#
# The test proves training genuinely happened - not just that `sky launch`
# exited zero - by asserting the job reached SUCCEEDED status via `sky queue`
# and that its logs contain a real HuggingFace Trainer completion metric.

steps:
- id: "skypilot-dws-kueue: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/skypilot-dws-kueue/tests /workspace/skypilot-dws-kueue/tests

- id: "skypilot-dws-kueue: validate platform"
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/skypilot-dws-kueue"
  script: |
    terraform init -no-color
    terraform validate -no-color
  waitFor: ["skypilot-dws-kueue: prepare tests"]

- id: 'skypilot-dws-kueue: create gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/skypilot-dws-kueue"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/skypilot_gke_cluster_result.txt
    terraform apply \
    -var=project_id=$PROJECT_ID \
    -var=create_cluster=true \
    -var=cluster_name=ml-skypilot-$_BUILD_ID \
    -var=cluster_location=$_SKYPILOT_REGION \
    -var=autopilot_cluster=true \
    -var=enable_gpu=true \
    -var=create_service_account=false \
    -var=create_brand=false \
    -var=create_gcs_bucket=true \
    -var=gcs_bucket=ml-skypilot-$_BUILD_ID \
    -auto-approve -no-color
    echo "pass" > /workspace/skypilot_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["skypilot-dws-kueue: validate platform"]

- id: 'skypilot-dws-kueue: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-skypilot-${_BUILD_ID}'
  - '--region=${_SKYPILOT_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['skypilot-dws-kueue: create gke cluster']

- id: 'skypilot-dws-kueue: deploy kueue'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/skypilot-dws-kueue"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/skypilot_deploy_kueue_result.txt

    kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/v0.12.0/manifests.yaml
    kubectl wait deployment/kueue-controller-manager -n kueue-system --for=condition=Available --timeout=300s

    kubectl apply -f kueue_resources.yaml
    kubectl wait clusterqueue/dws-cluster-queue --for=condition=Active --timeout=120s
    kubectl wait admissioncheck/dws-prov --for=condition=Active --timeout=120s

    echo "pass" > /workspace/skypilot_deploy_kueue_result.txt
  allowFailure: true
  waitFor: ['skypilot-dws-kueue: generate kubeconfig']

- id: "skypilot-dws-kueue: test guide"
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/skypilot-dws-kueue"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/skypilot_test_guide.txt

    apt update
    apt install python3-venv python3-pip --assume-yes
    pip install "skypilot[kubernetes]"

    sky check kubernetes

    CLUSTER_NAME=ci-$_BUILD_ID
    sky launch -c $$CLUSTER_NAME --yes train_dws.yaml

    python3 /workspace/skypilot-dws-kueue/tests/test.py "$$CLUSTER_NAME"

    sky down -y $$CLUSTER_NAME || true

    echo "pass" > /workspace/skypilot_test_guide.txt
  allowFailure: true
  waitFor: ['skypilot-dws-kueue: deploy kueue']

- id: 'skypilot-dws-kueue: cleanup'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/skypilot-dws-kueue"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/skypilot_cleanup_result.txt
    terraform destroy \
    -var=project_id=$PROJECT_ID \
    -var=create_cluster=true \
    -var=cluster_name=ml-skypilot-$_BUILD_ID \
    -var=cluster_location=$_SKYPILOT_REGION \
    -var=autopilot_cluster=true \
    -var=enable_gpu=true \
    -var=create_service_account=false \
    -var=create_brand=false \
    -var=create_gcs_bucket=true \
    -var=gcs_bucket=ml-skypilot-$_BUILD_ID \
    -auto-approve -no-color
    echo "pass" > /workspace/skypilot_cleanup_result.txt
  allowFailure: true
  waitFor: ['skypilot-dws-kueue: test guide']

- id: 'skypilot-dws-kueue: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "skypilot-dws-kueue") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/skypilot_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* skypilot-dws-kueue gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/skypilot_deploy_kueue_result.txt) != "pass" ]]; then
      failed_steps+="* skypilot-dws-kueue kueue deployment failed\n"
    fi

    if [[ $(cat /workspace/skypilot_test_guide.txt) != "pass" ]]; then
      failed_steps+="* skypilot-dws-kueue test guide failed\n"
    fi

    if [[ $(cat /workspace/skypilot_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* skypilot-dws-kueue cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="SkyPilot DWS Kueue CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "skypilot-dws-kueue", "ci/automated-issue"]}' "$issue_title" "$issue_body")

      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['skypilot-dws-kueue: cleanup']

- id: 'skypilot-dws-kueue: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    for f in skypilot_gke_cluster_result skypilot_deploy_kueue_result skypilot_test_guide skypilot_cleanup_result; do
      if [[ $(cat /workspace/$f.txt) != "pass" ]]; then
        echo "$f failed"
        echo "error" > /workspace/check_result.txt
      fi
    done

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['skypilot-dws-kueue: create github issue']

substitutions:
  _SKYPILOT_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 3600s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
