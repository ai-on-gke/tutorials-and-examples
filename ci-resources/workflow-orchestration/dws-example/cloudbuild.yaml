#
# tf/cluster.tf hardcodes the cluster name ("dws-cluster-demo") and network
# name ("dws-network") instead of deriving build-unique ones - left as-is
# (not this pipeline's terraform to change), so a best-effort pre-cleanup
# runs first in case a prior aborted run left either behind. Concurrent runs
# of this pipeline would still collide on both names; accepted as a known
# limitation rather than editing the example's own terraform.
#
# Installs Kueue at the version pinned in the example's own README (v0.12.0)
# rather than "latest", so this doesn't silently break on a Kueue release
# that changes the CRDs.
#
# The test proves DWS actually provisioned real GPU capacity on demand
# (not just that Autopilot happened to schedule the pod some other way):
# it asserts the Kueue ProvisioningRequest reaches Accepted+Provisioned,
# then that the job itself completes on a node with the requested
# nvidia-tesla-t4 accelerator.

steps:
- id: "dws-example: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/workflow-orchestration/dws-example/tests /workspace/workflow-orchestration/dws-example/tests

      echo "Best-effort cleanup of any leftover cluster/network from an aborted prior run."
      gcloud container clusters delete dws-cluster-demo \
        --region=$_DWS_REGION --project=$PROJECT_ID --quiet 2>/dev/null || true
      gcloud compute networks delete dws-network \
        --project=$PROJECT_ID --quiet 2>/dev/null || true

- id: "dws-example: validate platform"
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/workflow-orchestration/dws-example/tf"
  script: |
    terraform init -no-color
    terraform validate -no-color
  waitFor: ["dws-example: prepare tests"]

- id: 'dws-example: create gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/workflow-orchestration/dws-example/tf"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/dws_example_gke_cluster_result.txt
    terraform apply \
    -var=project_id=$PROJECT_ID \
    -var=region=$_DWS_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/dws_example_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["dws-example: validate platform"]

- id: 'dws-example: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'dws-cluster-demo'
  - '--region=${_DWS_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['dws-example: create gke cluster']

- id: 'dws-example: deploy kueue and job'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/workflow-orchestration/dws-example"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/dws_example_deploy_result.txt

    kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/v0.12.0/manifests.yaml
    kubectl wait deployment/kueue-controller-manager -n kueue-system --for=condition=Available --timeout=300s

    kubectl apply -f dws-queues.yaml
    kubectl wait clusterqueue/dws-cluster-queue --for=condition=Active --timeout=120s
    kubectl wait admissioncheck/dws-prov --for=condition=Active --timeout=120s

    JOB_NAME=$(kubectl create -f job-autopilot.yaml -o jsonpath='{.metadata.name}')
    echo "$$JOB_NAME" > /workspace/dws_example_job_name.txt

    echo "pass" > /workspace/dws_example_deploy_result.txt
  allowFailure: true
  waitFor: ['dws-example: generate kubeconfig']

- id: "dws-example: test guide"
  name: "gcr.io/cloud-builders/kubectl"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/dws_example_test_guide.txt

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes

    python3 /workspace/workflow-orchestration/dws-example/tests/test.py \
      "$(cat /workspace/dws_example_job_name.txt)"

    echo "pass" > /workspace/dws_example_test_guide.txt
  allowFailure: true
  waitFor: ['dws-example: deploy kueue and job']

- id: 'dws-example: cleanup'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/workflow-orchestration/dws-example/tf"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/dws_example_cleanup_result.txt
    terraform destroy \
    -var=project_id=$PROJECT_ID \
    -var=region=$_DWS_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/dws_example_cleanup_result.txt
  allowFailure: true
  waitFor: ['dws-example: test guide']

- id: 'dws-example: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "workflow-orchestration-dws-example") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/dws_example_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* dws-example gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/dws_example_deploy_result.txt) != "pass" ]]; then
      failed_steps+="* dws-example kueue/job deployment failed\n"
    fi

    if [[ $(cat /workspace/dws_example_test_guide.txt) != "pass" ]]; then
      failed_steps+="* dws-example test guide failed\n"
    fi

    if [[ $(cat /workspace/dws_example_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* dws-example cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="Workflow Orchestration DWS Example CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "workflow-orchestration-dws-example", "ci/automated-issue"]}' "$issue_title" "$issue_body")

      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['dws-example: cleanup']

- id: 'dws-example: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    for f in dws_example_gke_cluster_result dws_example_deploy_result dws_example_test_guide dws_example_cleanup_result; do
      if [[ $(cat /workspace/$f.txt) != "pass" ]]; then
        echo "$f failed"
        echo "error" > /workspace/check_result.txt
      fi
    done

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['dws-example: create github issue']

substitutions:
  _DWS_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 3600s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
