# blue-green-gateway/ has no terraform module of its own (SETUP.md drives the
# cluster directly with gcloud), so this mirrors the autoscale/ pipeline shape
# rather than the terraform-module pattern used elsewhere in ci-resources/.

steps:
- id: "blue-green-gateway: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/blue-green-gateway/tests /workspace/blue-green-gateway/tests

- id: 'blue-green-gateway: create gke cluster'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/bgg_gke_cluster_result.txt
    gcloud container clusters create-auto ml-bgg-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_BGG_REGION
    echo "pass" > /workspace/bgg_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["blue-green-gateway: prepare tests"]

- id: 'blue-green-gateway: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-bgg-${SHORT_SHA}-${_BUILD_ID}'
  - '--region=${_BGG_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['blue-green-gateway: create gke cluster']

- id: 'blue-green-gateway: deploy gateway'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/blue-green-gateway"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/bgg_deploy_gateway_result.txt

    kubectl create secret generic hf-secret \
      --from-literal=hf_token=$$HF_TOKEN \
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl apply -f gateway.yaml
    kubectl apply -f gateway-access.yaml

    echo "pass" > /workspace/bgg_deploy_gateway_result.txt
  secretEnv: ["HF_TOKEN"]
  allowFailure: true
  waitFor: ['blue-green-gateway: generate kubeconfig']

- id: 'blue-green-gateway: deploy blue and route'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/blue-green-gateway"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/bgg_deploy_blue_result.txt

    kubectl apply -f blue-vllm-deployment.yaml
    kubectl apply -f blue-vllm-service.yaml
    kubectl apply -f blue-health-policy.yaml
    kubectl apply -f blue-route.yaml
    kubectl wait --for=condition=Available --timeout=900s deployment/blue-vllm-gemma-deployment

    echo "pass" > /workspace/bgg_deploy_blue_result.txt
  allowFailure: true
  waitFor: ['blue-green-gateway: deploy gateway']

- id: 'blue-green-gateway: test blue is live'
  name: "gcr.io/cloud-builders/kubectl"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/bgg_test_blue_result.txt

    GATEWAY_IP=$(kubectl get gateway blue-green-gateway -o jsonpath='{.status.addresses[0].value}')
    n=0
    while [ -z "$$GATEWAY_IP" ] && [ $n -lt 60 ]; do
      echo "Waiting for Gateway IP..."
      sleep 10
      GATEWAY_IP=$(kubectl get gateway blue-green-gateway -o jsonpath='{.status.addresses[0].value}')
      n=$((n+1))
    done
    if [ -z "$$GATEWAY_IP" ]; then
      echo "Gateway never got an address."
      exit 1
    fi
    echo "Gateway IP: $$GATEWAY_IP"
    echo "$$GATEWAY_IP" > /workspace/bgg_gateway_ip.txt

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/blue-green-gateway/tests/test.py "$$GATEWAY_IP" blue

    echo "pass" > /workspace/bgg_test_blue_result.txt
  allowFailure: true
  waitFor: ['blue-green-gateway: deploy blue and route']

- id: 'blue-green-gateway: deploy green and switch'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/blue-green-gateway"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/bgg_deploy_green_result.txt

    kubectl apply -f green-vllm-deployment.yaml
    kubectl apply -f green-vllm-service.yaml
    kubectl apply -f green-health-policy.yaml
    kubectl wait --for=condition=Available --timeout=900s deployment/green-vllm-gemma-deployment

    # Atomically switches 100% of traffic from blue to green.
    kubectl apply -f green-route.yaml

    echo "pass" > /workspace/bgg_deploy_green_result.txt
  allowFailure: true
  waitFor: ['blue-green-gateway: test blue is live']

- id: 'blue-green-gateway: test green is live'
  name: "gcr.io/cloud-builders/kubectl"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/bgg_test_green_result.txt

    GATEWAY_IP=$(cat /workspace/bgg_gateway_ip.txt)

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/blue-green-gateway/tests/test.py "$$GATEWAY_IP" green

    echo "pass" > /workspace/bgg_test_green_result.txt
  allowFailure: true
  waitFor: ['blue-green-gateway: deploy green and switch']

- id: 'blue-green-gateway: cleanup'
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/bgg_cleanup_result.txt
    gcloud container clusters delete ml-bgg-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_BGG_REGION \
      --quiet
    echo "pass" > /workspace/bgg_cleanup_result.txt
  allowFailure: true
  waitFor: ['blue-green-gateway: test green is live']

- id: 'blue-green-gateway: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "blue-green-gateway") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/bgg_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/bgg_deploy_gateway_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway gateway deployment failed\n"
    fi

    if [[ $(cat /workspace/bgg_deploy_blue_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway blue deployment failed\n"
    fi

    if [[ $(cat /workspace/bgg_test_blue_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway blue verification failed\n"
    fi

    if [[ $(cat /workspace/bgg_deploy_green_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway green deployment/switch failed\n"
    fi

    if [[ $(cat /workspace/bgg_test_green_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway green verification failed\n"
    fi

    if [[ $(cat /workspace/bgg_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* blue-green-gateway cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="Blue-Green Gateway CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "blue-green-gateway", "ci/automated-issue"]}' "$issue_title" "$issue_body")


      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['blue-green-gateway: cleanup']

- id: 'blue-green-gateway: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    for f in bgg_gke_cluster_result bgg_deploy_gateway_result bgg_deploy_blue_result bgg_test_blue_result bgg_deploy_green_result bgg_test_green_result bgg_cleanup_result; do
      if [[ $(cat /workspace/$f.txt) != "pass" ]]; then
        echo "$f failed"
        echo "error" > /workspace/check_result.txt
      fi
    done

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['blue-green-gateway: create github issue']

substitutions:
  _BGG_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/cloudbuild-hf-token/versions/latest
    env: "HF_TOKEN"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
