#
# This example has its own terraform module (infra/gcp) rather than the shared
# common-infra one, and its "test" IS the assertion: config.yaml's
# PodStartupLatency measurement carries a real 15s threshold, and ClusterLoader2
# exits non-zero if it's violated - so running it under `set -e` is the test,
# no separate assertion script needed. No container image to build either: the
# benchmark deploys plain busybox pods to simulate sandbox agents.

steps:
- id: 'agent-sandbox-benchmark: create gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/benchmarks/agent-sandbox/infra/gcp"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/agent_sandbox_gke_cluster_result.txt
    terraform init -no-color
    terraform apply \
    -var-file=values.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=default_name=ml-agent-sbx-$SHORT_SHA-$_BUILD_ID \
    -var=region=$_AGENT_SANDBOX_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/agent_sandbox_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["-"]

- id: 'agent-sandbox-benchmark: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-agent-sbx-${SHORT_SHA}-${_BUILD_ID}'
  - '--region=${_AGENT_SANDBOX_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['agent-sandbox-benchmark: create gke cluster']

- id: 'agent-sandbox-benchmark: run clusterloader2'
  name: 'golang:1.23'
  dir: '/workspace/benchmarks/agent-sandbox/tests/agent-sandbox'
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/agent_sandbox_benchmark_result.txt

    # $$HOME (and therefore $$HOME/.kube/config, written by the "generate
    # kubeconfig" step above) persists across Cloud Build steps just like
    # /workspace does, so no manual copy is needed here.
    git clone --depth 1 https://github.com/kubernetes/perf-tests.git /tmp/perf-tests
    cp config.yaml /tmp/perf-tests/clusterloader2/config.yaml
    cp agent-sandbox-deployment.yaml /tmp/perf-tests/clusterloader2/agent-sandbox-deployment.yaml

    cd /tmp/perf-tests/clusterloader2
    go run cmd/clusterloader.go \
      --testconfig=./config.yaml \
      --provider=gke \
      --kubeconfig=$$HOME/.kube/config \
      --report-dir=./test-results

    # ClusterLoader2 exits non-zero on its own if the 15s PodStartupLatency SLO
    # in config.yaml is violated - reaching this line means it passed.
    echo "pass" > /workspace/agent_sandbox_benchmark_result.txt
  allowFailure: true
  waitFor: ['agent-sandbox-benchmark: generate kubeconfig']

- id: 'agent-sandbox-benchmark: cleanup gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/benchmarks/agent-sandbox/infra/gcp"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/agent_sandbox_cleanup_result.txt
    terraform destroy \
    -var-file=values.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=default_name=ml-agent-sbx-$SHORT_SHA-$_BUILD_ID \
    -var=region=$_AGENT_SANDBOX_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/agent_sandbox_cleanup_result.txt
  allowFailure: true
  waitFor: ['agent-sandbox-benchmark: run clusterloader2']

- id: 'agent-sandbox-benchmark: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "agent-sandbox-benchmark") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/agent_sandbox_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* agent-sandbox-benchmark gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/agent_sandbox_benchmark_result.txt) != "pass" ]]; then
      failed_steps+="* agent-sandbox-benchmark ClusterLoader2 run failed (or exceeded the pod-startup-latency SLO)\n"
    fi

    if [[ $(cat /workspace/agent_sandbox_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* agent-sandbox-benchmark gke cluster cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="Agent Sandbox Benchmark CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "agent-sandbox-benchmark", "ci/automated-issue"]}' "$issue_title" "$issue_body")


      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['agent-sandbox-benchmark: cleanup gke cluster']

- id: 'agent-sandbox-benchmark: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    if [[ $(cat /workspace/agent_sandbox_gke_cluster_result.txt) != "pass" ]]; then
      echo "agent-sandbox-benchmark gke cluster creation failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/agent_sandbox_benchmark_result.txt) != "pass" ]]; then
      echo "agent-sandbox-benchmark ClusterLoader2 run failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/agent_sandbox_cleanup_result.txt) != "pass" ]]; then
      echo "agent-sandbox-benchmark gke cluster cleanup failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['agent-sandbox-benchmark: create github issue']

substitutions:
  _AGENT_SANDBOX_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
