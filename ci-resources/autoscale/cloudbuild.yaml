#
# The autoscale/ example has no terraform module of its own - the README drives the
# cluster and every resource directly with gcloud/kubectl - so this pipeline mirrors
# that shape instead of the terraform-module pattern used by the ADK/flowise/ray-serve
# examples elsewhere in ci-resources/.
#
# Scope: this verifies (1) the vLLM/Gemma server actually serves a real chat
# completion, and (2) the full custom-metrics pipeline (Managed Prometheus -> Cloud
# Monitoring -> Stackdriver adapter -> HPA) is wired correctly end to end, i.e. the
# HPA receives a real metric reading instead of staying unknown. It does not run a
# sustained load test to observe an actual scale-up event, which would add several
# more minutes and flakiness for a claim (autoscaling triggers under load) that is
# GKE/HPA's own well-tested behavior, not this tutorial's.

steps:
- id: "autoscale: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/autoscale/tests /workspace/autoscale/tests

- id: 'autoscale: create gke cluster'
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/autoscale_gke_cluster_result.txt
    gcloud container clusters create-auto ml-autoscale-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_AUTOSCALE_REGION
    echo "pass" > /workspace/autoscale_gke_cluster_result.txt
  allowFailure: true
  waitFor: ["autoscale: prepare tests"]

- id: 'autoscale: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-autoscale-${SHORT_SHA}-${_BUILD_ID}'
  - '--region=${_AUTOSCALE_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['autoscale: create gke cluster']

- id: 'autoscale: deploy vllm server'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/autoscale"
  secretEnv: ["HF_TOKEN"]
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/autoscale_deploy_vllm_result.txt

    kubectl create secret generic hf-secret \
      --from-literal=hf_token=$$HF_TOKEN \
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl apply -f vllm-deployment.yaml
    kubectl apply -f vllm-service.yaml
    kubectl wait --for=condition=Available --timeout=900s deployment/vllm-gemma-deployment

    echo "pass" > /workspace/autoscale_deploy_vllm_result.txt
  allowFailure: true
  waitFor: ['autoscale: generate kubeconfig']

- id: 'autoscale: test guide'
  name: "gcr.io/cloud-builders/kubectl"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/autoscale_test_guide.txt

    kubectl port-forward service/vllm-service 8080:8081 &
    sleep 5s

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/autoscale/tests/test.py http://127.0.0.1:8080 google/gemma-3-1b-it

    echo "pass" > /workspace/autoscale_test_guide.txt
  allowFailure: true
  waitFor: ['autoscale: deploy vllm server']

- id: 'autoscale: deploy metrics adapter'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/autoscale"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/autoscale_deploy_metrics_result.txt

    kubectl apply -f ./stack-driver-adapter.yaml
    kubectl rollout status deployment/custom-metrics-stackdriver-adapter -n custom-metrics --timeout=300s

    GSA_NAME="msa-$SHORT_SHA-$_BUILD_ID"
    gcloud iam service-accounts create "$$GSA_NAME" \
      --project="$PROJECT_ID" \
      --display-name="Custom Metrics Stackdriver Adapter GSA (CI $SHORT_SHA-$_BUILD_ID)"

    # Written immediately after creation (not at the end of the script) so
    # cleanup can find and delete this GSA even if a later step in this
    # script times out.
    echo "$$GSA_NAME" > /workspace/autoscale_gsa_name.txt

    gcloud projects add-iam-policy-binding "$PROJECT_ID" \
      --member="serviceAccount:$${GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
      --role="roles/monitoring.viewer" \
      --condition=None

    gcloud iam service-accounts add-iam-policy-binding \
      "$${GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
      --project="$PROJECT_ID" \
      --role="roles/iam.workloadIdentityUser" \
      --member="serviceAccount:${PROJECT_ID}.svc.id.goog[custom-metrics/custom-metrics-stackdriver-adapter]"

    kubectl annotate serviceaccount \
      custom-metrics-stackdriver-adapter \
      --namespace custom-metrics \
      --overwrite \
      iam.gke.io/gcp-service-account="$${GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"

    # Workload Identity bindings can take a short moment to propagate; restart the
    # adapter so it picks up the newly-annotated service account identity.
    kubectl rollout restart deployment/custom-metrics-stackdriver-adapter -n custom-metrics
    kubectl rollout status deployment/custom-metrics-stackdriver-adapter -n custom-metrics --timeout=300s

    echo "pass" > /workspace/autoscale_deploy_metrics_result.txt
  allowFailure: true
  waitFor: ['autoscale: deploy vllm server']

- id: 'autoscale: verify autoscaling wiring'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/autoscale"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/autoscale_verify_hpa_result.txt

    kubectl apply -f ./pod-monitoring.yaml
    kubectl apply -f ./horizontal-pod-autoscaler.yaml

    # Generate a few minutes of background load so the vllm:num_requests_running
    # metric has something real to report while Managed Prometheus scrapes it
    # (15s interval) and propagates it through Cloud Monitoring to the adapter.
    # NOTE: the README's load-testing section says "llm-service", but the only
    # Service manifest that actually exists is vllm-service.yaml (vllm-service) -
    # that looks like a stale name left over in the docs. Using the real one here.
    kubectl port-forward service/vllm-service 8081:8081 &
    PORT_FORWARD_PID=$!
    sleep 5s
    chmod +x ./request-looper.sh
    ./request-looper.sh 8081 google/gemma-3-1b-it "Explain Kubernetes autoscaling." &
    LOOP_PID=$!

    metric_seen="false"
    for i in $(seq 1 20); do
      current_metrics=$(kubectl get hpa gemma-server-hpa -o jsonpath='{.status.currentMetrics}')
      echo "Attempt $i: currentMetrics=${current_metrics}"
      if [ -n "$current_metrics" ] && [ "$current_metrics" != "[]" ]; then
        metric_seen="true"
        break
      fi
      sleep 30s
    done

    kill $$LOOP_PID 2>/dev/null || true
    kill $$PORT_FORWARD_PID 2>/dev/null || true

    kubectl describe hpa gemma-server-hpa

    if [ "$metric_seen" != "true" ]; then
      echo "HPA never received a real metric reading from the custom metrics pipeline."
      exit 1
    fi

    echo "pass" > /workspace/autoscale_verify_hpa_result.txt
  allowFailure: true
  waitFor: ['autoscale: deploy metrics adapter']

- id: 'autoscale: cleanup'
  name: "gcr.io/cloud-builders/kubectl"
  dir: "/workspace/autoscale"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/autoscale_cleanup_result.txt

    if [ -f /workspace/autoscale_gsa_name.txt ]; then
      GSA_NAME=$(cat /workspace/autoscale_gsa_name.txt)
      gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
        --member="serviceAccount:$${GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
        --role="roles/monitoring.viewer" --condition=None || true
      gcloud iam service-accounts delete \
        "$${GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
        --project="$PROJECT_ID" --quiet || true
    fi

    gcloud container clusters delete ml-autoscale-$SHORT_SHA-$_BUILD_ID \
      --project=$PROJECT_ID \
      --region=$_AUTOSCALE_REGION \
      --quiet

    echo "pass" > /workspace/autoscale_cleanup_result.txt
  allowFailure: true
  waitFor: ['autoscale: verify autoscaling wiring', 'autoscale: test guide']

- id: 'autoscale: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    jwt=$(python3 generate_jwt.py)
    gh_token=$(curl --request POST \
    --url "https://api.github.com/app/installations/90973651/access_tokens" \
    --header "Accept: application/vnd.github+json" \
    --header "Authorization: Bearer $jwt" \
    --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $gh_token" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "autoscale") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/autoscale_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* autoscale gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/autoscale_deploy_vllm_result.txt) != "pass" ]]; then
      failed_steps+="* autoscale vllm deployment failed\n"
    fi

    if [[ $(cat /workspace/autoscale_test_guide.txt) != "pass" ]]; then
      failed_steps+="* autoscale test guide failed\n"
    fi

    if [[ $(cat /workspace/autoscale_deploy_metrics_result.txt) != "pass" ]]; then
      failed_steps+="* autoscale metrics adapter deployment failed\n"
    fi

    if [[ $(cat /workspace/autoscale_verify_hpa_result.txt) != "pass" ]]; then
      failed_steps+="* autoscale HPA metrics wiring verification failed\n"
    fi

    if [[ $(cat /workspace/autoscale_cleanup_result.txt) != "pass" ]]; then
      failed_steps+="* autoscale cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="Autoscale CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "autoscale", "ci/automated-issue"]}' "$issue_title" "$issue_body")


      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['autoscale: cleanup']

- id: 'autoscale: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    if [[ $(cat /workspace/autoscale_gke_cluster_result.txt) != "pass" ]]; then
      echo "autoscale gke cluster creation failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/autoscale_deploy_vllm_result.txt) != "pass" ]]; then
      echo "autoscale vllm deployment failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/autoscale_test_guide.txt) != "pass" ]]; then
      echo "autoscale test guide failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/autoscale_deploy_metrics_result.txt) != "pass" ]]; then
      echo "autoscale metrics adapter deployment failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/autoscale_verify_hpa_result.txt) != "pass" ]]; then
      echo "autoscale HPA metrics wiring verification failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/autoscale_cleanup_result.txt) != "pass" ]]; then
      echo "autoscale cleanup failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['autoscale: create github issue']

substitutions:
  _AUTOSCALE_REGION: us-central1
  _USER_NAME: github
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
  _GITHUB_ISSUE: "false"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/cloudbuild-hf-token/versions/latest
    env: "HF_TOKEN"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
